<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe0" />
    <title>くそざこ村 — idle</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Start screen: slot selector + difficulty chooser -->
    <div id="start-screen" class="start-screen">
      <div class="start-card">
        <h1 class="start-title">くそざこ村</h1>
        <div class="start-sub">セーブスロットを選んでラン開始</div>
        <div id="slot-cards" class="slot-cards"></div>
        <div id="difficulty-chooser" class="difficulty-chooser hidden">
          <div class="start-sub">難度を選べ</div>
          <button class="diff-btn" data-difficulty="beginner">
            <b>初心者</b><small>普通の村シム級、建て直し余裕あり</small>
          </button>
          <button class="diff-btn" data-difficulty="standard">
            <b>標準（激ムズ）</b><small>設計基準、常に対応追われる</small>
          </button>
          <button class="diff-btn" data-difficulty="hell">
            <b>くそざこ地獄</b><small>無理ゲー、連鎖災害で秒全滅</small>
          </button>
          <button id="diff-cancel" class="diff-cancel">キャンセル</button>
        </div>
      </div>
    </div>

    <div id="app">
      <div id="stage"></div>
      <canvas id="minimap" class="minimap" width="240" height="135"></canvas>
      <div id="camera-help" class="camera-help">WASD: パン ・ F: フラナ ・ R: リセット</div>
      <aside id="hud">
        <header id="hud-header">
          <div class="hud-title-row">
            <div class="hud-title">くそざこ村</div>
            <div class="rank-badge"><span>ランク</span><b id="stat-rank">村</b><span class="rank-lv">Lv<b id="stat-village-lv">1</b></span><span id="stat-difficulty" class="stat-difficulty">標準</span></div>
          </div>
          <div class="rank-progress-row">
            <div id="rank-progress">初期状態</div>
            <div class="rank-bar"><div id="rank-bar-fill" class="rank-bar-fill"></div></div>
          </div>
          <div class="stat-grid">
            <div class="stat"><span>P</span><b id="stat-points">0</b></div>
            <div class="stat"><span>人口</span><b><span id="stat-pop">0</span>/<span id="stat-cap">0</span></b></div>
            <div class="stat"><span>死</span><b id="stat-deaths">0</b></div>
            <div class="stat"><span>季節</span><b id="stat-season">春</b></div>
          </div>
          <div class="stat-grid resource-row">
            <div class="stat"><span>🍞</span><b id="stat-food">0</b></div>
            <div class="stat"><span>💧</span><b id="stat-water">0</b></div>
            <div class="stat"><span>🪵</span><b id="stat-wood">0</b></div>
            <div class="stat"><span>🪨</span><b id="stat-stone">0</b></div>
            <div class="stat"><span>🪚</span><b id="stat-plank">0</b></div>
          </div>
          <div class="weather-row">
            <span class="weather-now" id="weather-now">☀ 快晴</span>
            <span class="weather-fc" id="weather-fc">→ ☁ → 🌦</span>
          </div>
        </header>

        <nav id="tabs" class="tabs">
          <button class="tab active" data-tab="build">建物</button>
          <button class="tab" data-tab="dex">図鑑 <small id="dex-count">0/0</small></button>
          <button class="tab" data-tab="log">記録</button>
          <button class="tab" data-tab="debug">デバッグ</button>
        </nav>

        <section class="tab-panel active" data-panel="build">
          <div class="build-section">
            <div class="build-section-title">開拓（プロット）</div>
            <div class="plot-build-row">
              <button class="plot-build-btn" data-plot-kind="farm" title="畑 (wood×2)">🌾 畑<small>🪵×2</small></button>
              <button class="plot-build-btn" data-plot-kind="channel" title="水路 (stone×1)">💧 水路<small>🪨×1</small></button>
              <button class="plot-build-btn" data-plot-kind="path" title="道 (stone×1)">🛤 道<small>🪨×1</small></button>
              <button class="plot-build-btn" data-plot-kind="house" title="家 (wood×6 + stone×3, 定員4)">🏠 家<small>🪵×6 🪨×3</small></button>
              <button class="plot-build-btn" data-plot-kind="well" title="井戸 (wood×1 + stone×8) — 干魃でも水供給">⛲ 井戸<small>🪵×1 🪨×8</small></button>
              <button class="plot-build-btn" data-plot-kind="firewatch" title="火の見やぐら (wood×10 + stone×2) — 半径180pxの火事ダメージ×0.25">🔥 火の見<small>🪵×10 🪨×2</small></button>
              <button class="plot-build-btn" data-plot-kind="sawmill" title="製材所 (wood×8 + stone×4) — 近くのちびわふが wood 2 → plank 1 に変換">🪚 製材所<small>🪵×8 🪨×4</small></button>
              <button class="plot-build-btn" data-plot-kind="shrine" title="神社 (wood×3 + stone×5 + plank×2) — 半径200px以内のちびわふの空腹・疲労が-30%">⛩ 神社<small>🪵×3 🪨×5 🪚×2</small></button>
            </div>
            <div id="plot-build-hint" class="plot-build-hint">ボタンを押してから地面の好きな場所を左クリック</div>
          </div>
          <div id="build-list"></div>
          <div class="actions">
            <button id="btn-ondo" title="くそざこ音頭をかける">音頭</button>
            <button id="btn-bokai" title="棒会議を開催する">棒会議</button>
            <button id="btn-fire" title="火事を発生させる">火事</button>
          </div>
        </section>

        <section class="tab-panel" data-panel="dex">
          <div id="dex-list"></div>
        </section>

        <section class="tab-panel" data-panel="log">
          <div class="log-stats">
            <div><span>世代</span><b id="stat-gen">0</b></div>
            <div><span>踏まれた数</span><b id="stat-stomp">0</b></div>
            <div><span>平均寿命</span><b id="stat-avg-life">0s</b></div>
            <div><span>最長寿</span><b id="stat-longest-life">—</b></div>
            <div><span>最短寿</span><b id="stat-shortest-life">—</b></div>
          </div>
          <ol id="recent-deaths"></ol>
        </section>

        <section class="tab-panel debug" data-panel="debug">
          <div class="debug-row">
            <span>速度</span>
            <div class="speed-buttons" id="speed-buttons"></div>
          </div>
          <div class="debug-row">
            <button id="btn-spawn" title="強制的に1体産む">+1体</button>
            <button id="btn-save">即セーブ</button>
            <button id="btn-reset" title="セーブ消去＆リロード">リセット</button>
          </div>
          <div class="debug-row small">
            <span>tick <b id="stat-tick">0</b></span>
            <span>時刻 <b id="stat-time">0s</b></span>
          </div>
        </section>
      </aside>
    </div>
    <div id="chibi-modal" class="chibi-modal hidden">
      <div class="chibi-modal-backdrop"></div>
      <div class="chibi-modal-card">
        <header>
          <div class="chibi-modal-title"><b id="modal-name">—</b> <span id="modal-age"></span></div>
          <button id="modal-close">×</button>
        </header>
        <div id="modal-traits" class="chibi-modal-traits"></div>
        <div id="modal-epitaph" class="chibi-modal-epitaph"></div>
        <div class="chibi-modal-section-title">性格値</div>
        <div id="modal-params" class="chibi-modal-params"></div>
        <div class="chibi-modal-section-title">性格メモ</div>
        <ul id="modal-flavors" class="chibi-modal-flavors"></ul>
        <div class="chibi-modal-section-title">人生</div>
        <ol id="modal-life" class="chibi-modal-life"></ol>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
